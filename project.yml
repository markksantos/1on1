name: OneOnOne
options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  bundleIdPrefix: com.markstudios

packages:
  OneOnOneKit:
    path: Packages/OneOnOneKit
  HotKey:
    url: https://github.com/soffes/HotKey
    from: "0.2.1"

targets:
  OneOnOne:
    type: application
    platform: macOS
    sources:
      - OneOnOne
      - path: OneOnOne/PrivacyInfo.xcprivacy
        type: file
    # NOTE: iCloud / CloudKit entitlements are intentionally NOT listed here.
    # Personal Apple development accounts cannot generate provisioning profiles
    # that include the `com.apple.developer.icloud-*` capabilities, which would
    # break local builds. When upgrading to a paid Apple Developer account for
    # App Store submission, add the following keys back to this entitlements block:
    #   com.apple.developer.icloud-services: [CloudKit]
    #   com.apple.developer.icloud-container-identifiers: [iCloud.com.markstudios.OneOnOne]
    entitlements:
      path: OneOnOne/OneOnOne.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    info:
      path: OneOnOne/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleName: 1on1
        CFBundleDisplayName: 1on1
        CFBundleSpokenName: one on one
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.social-networking
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 Mark Studios LLC. All rights reserved."
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "1on1 uses your local network to discover and message your partner."
        NSBonjourServices:
          - _1on1._tcp
          - _1on1._udp
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8W75GJ2YQ3
        CODE_SIGN_IDENTITY: "Apple Development"
        PRODUCT_BUNDLE_IDENTIFIER: com.markstudios.OneOnOne
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: OneOnOneKit
        product: OneOnOneEngine
      - package: OneOnOneKit
        product: OneOnOneUI
      - package: HotKey
